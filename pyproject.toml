[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "soccercal"
version = "0.5.0"
description = "Broadcast soccer video -> SkillCorner-style tracking data (calibration, tracking, re-identification)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "opencv-python>=4.7",
    "torch>=2.0",
    "torchvision>=0.15",
    "ultralytics>=8.1",
    "tqdm",
    "certifi",
    "matplotlib",
    # shirt numbers (OCR models ship inside the wheel). Its releases >= 1.3 declare Python < 3.13
    # but run on 3.13: there it is installed with --ignore-requires-python (see the notebooks'
    # install cell or `soccercal doctor`), so it must not be a hard requirement.
    "rapidocr_onnxruntime>=1.3; python_version < '3.13'",
]

[project.optional-dependencies]
kloppy = ["kloppy>=3.15"]
notebooks = ["jupyterlab", "ipykernel", "kloppy>=3.15"]
colab = ["kloppy>=3.15"]  # Google Colab already has the notebook server
dev = ["pytest", "kloppy>=3.15", "nbformat"]

[project.scripts]
soccercal = "soccercal.cli:main"

[tool.setuptools]
packages = ["soccercal"]

[tool.setuptools.package-data]
soccercal = ["data/*.csv", "data/*.txt", "data/*.pt", "data/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
